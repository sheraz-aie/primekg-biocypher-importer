# -----------------
# --- NODE TYPES ---
# -----------------
anatomy:
  is_a: biolink:AnatomicalEntity
  input_label: anatomy
  properties: {name: str, source: str}
biological_process:
  is_a: biolink:BiologicalProcess
  input_label: biological_process
  properties: {name: str, source: str}
cellular_component:
  is_a: biolink:CellularComponent
  input_label: cellular_component
  properties: {name: str, source: str}
disease:
  is_a: biolink:Disease
  input_label: disease
  properties: {name: str, source: str}
drug:
  is_a: biolink:Drug
  input_label: drug
  properties: {name: str, source: str}
'effect/phenotype':
  is_a: biolink:PhenotypicFeature
  input_label: effect/phenotype
  properties: {name: str, source: str}
exposure:
  is_a: biolink:ChemicalExposure
  input_label: exposure
  properties: {name: str, source: str}
protein: # Covers 'gene/protein'
  is_a: biolink:Protein
  input_label: protein
  properties: {name: str, source: str}
molecular_function:
  is_a: biolink:MolecularActivity
  input_label: molecular_function
  properties: {name: str, source: str}
pathway:
  is_a: biolink:Pathway
  input_label: pathway
  properties: {name: str, source: str}

